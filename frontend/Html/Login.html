<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="../Css/login.css">
</head>

<body>

    <div class="main-box">
        <h1>Login</h1>
    </div>


    <div id="login-id" class="login-card">

        <form class="form-class">
            <label> Phone no: </label>
            <input id="phone-id" class="input-class" type="tel" name="phone" placeholder=" +254 712345678">

            <label> Email: </label>
            <input id="password-id" class="input-class" type="password" name="email" placeholder="Password">

            <button type="submit"> Login </button>

        </form>


        <div class="sign-up">
            <p>Don't have an account? <a href="Signup.html">Sign up</a></p>
        </div>


    </div>

<script src="../Javascript/Login.js"></script>
</body>

</html>
