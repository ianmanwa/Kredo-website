<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link rel="stylesheet" href="../Css/Signup.css">
</head>

<body>

    <div class="main-box">
        <h1>Sign up</h1>
    </div>


    <div class="signup-card">

        <form id="Signup-id" class="form-class">
            <label> Phone no: </label>
            <input id="phone-id" class="input-class" type="tel" name="phone" placeholder=" +254 712345678">

            <label> Email: </label>
            <input id="password-id" class="input-class" type="password" name="email" placeholder="Password">

            <button type="submit"> Sign up </button>

        </form>


        <div class="sign-up">
            <p>Already have an account? <a href="Login.html">Login</a></p>
        </div>


    </div>

<script src="../Javascript/signup.js"></script>
</body>

</html>
